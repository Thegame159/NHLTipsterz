<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NHL Performance Studio</title>

    <!-- ✅ PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f97316" />

    <!-- ✅ Favicons (isto é o que normalmente resolve o "V") -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- ✅ iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Auto-recuperação: se o JS da app falhar a carregar (deploy a meio / cache antiga), limpa o service worker e a cache e recarrega uma vez -->
    <script>
      window.addEventListener(
        'error',
        function (e) {
          var t = e && e.target;
          if (!t || t.tagName !== 'SCRIPT' || !t.src || t.src.indexOf('/assets/') === -1) return;
          try {
            var last = Number(sessionStorage.getItem('nhl-heal') || 0);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('nhl-heal', String(Date.now()));
          } catch (_) {}
          var done = function () { location.reload(); };
          Promise.all([
            navigator.serviceWorker && navigator.serviceWorker.getRegistrations
              ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })
              : null,
            window.caches && caches.keys
              ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })
              : null,
          ]).then(done, done);
        },
        true
      );
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Bebas+Neue&family=Alex+Brush&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
      }
      .font-nhl-block {
        font-family: 'Bebas Neue', sans-serif;
        line-height: 0.8;
        letter-spacing: -0.01em;
      }
      .font-tipsterz {
        font-family: 'Alex Brush', cursive;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
